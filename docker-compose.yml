services:
  postgres:
    image: postgres:16-alpine
    container_name: medscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medscope_dev}
      POSTGRES_DB: ${POSTGRES_DB:-medscope_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medscope} -d ${POSTGRES_DB:-medscope_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medscope-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medscope}:${POSTGRES_PASSWORD:-medscope_dev}@postgres:5432/${POSTGRES_DB:-medscope_ai}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PYTHONPATH: /workspace
    volumes:
      - ./backend:/workspace/backend
      - ./ml:/workspace/ml
      - ./models:/workspace/models
      - ./datasets:/workspace/datasets
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

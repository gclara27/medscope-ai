<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>MedScope AI - Secure Clinical Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0058bc",
                        "on-tertiary-container": "#fdfcff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#38485a",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "on-primary": "#ffffff",
                        "primary-container": "#0070eb",
                        "outline-variant": "#c1c6d7",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#004493",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#0b1d2d",
                        "secondary-fixed-dim": "#b7c8de",
                        "on-surface-variant": "#414755",
                        "on-tertiary-fixed-variant": "#004883",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f3f4f5",
                        "on-background": "#191c1d",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e7e8e9",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-fixed": "#001c39",
                        "outline": "#717786",
                        "inverse-surface": "#2e3132",
                        "secondary": "#4f6073",
                        "on-primary-container": "#fefcff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#2976c7",
                        "surface-dim": "#d9dadb",
                        "surface-tint": "#005bc1",
                        "tertiary-fixed": "#d4e3ff",
                        "surface-container": "#edeeef",
                        "on-surface": "#191c1d",
                        "surface": "#f8f9fa",
                        "primary-fixed-dim": "#adc6ff",
                        "secondary-fixed": "#d2e4fb",
                        "on-primary-fixed": "#001a41",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-container": "#556679",
                        "secondary-container": "#d2e4fb",
                        "inverse-on-surface": "#f0f1f2",
                        "on-error": "#ffffff",
                        "inverse-primary": "#adc6ff",
                        "tertiary": "#005da7",
                        "background": "#f8f9fa",
                        "surface-bright": "#f8f9fa",
                        "surface-variant": "#e1e3e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "xxl": "48px",
                        "gutter": "24px",
                        "xl": "32px",
                        "margin-desktop": "40px",
                        "lg": "24px",
                        "unit": "4px",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-xl-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "mono-data": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    },
                    "boxShadow": {
                        "level-1": "0px 2px 4px rgba(0, 0, 0, 0.05)",
                        "level-2": "0px 8px 16px rgba(0, 0, 0, 0.08)",
                        "focus-glow": "0 0 0 2px #0058bc"
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom input styles based on guidance */
        .clinical-input {
            background-color: theme('colors.surface');
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.DEFAULT');
            padding: theme('spacing.sm') theme('spacing.md');
            color: theme('colors.on-surface');
            width: 100%;
            transition: all 0.2s ease;
            outline: none;
        }
        .clinical-input:focus {
            border-color: theme('colors.primary');
            box-shadow: theme('boxShadow.focus-glow');
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-level-1 overflow-hidden flex flex-col">
<!-- Header Section -->
<div class="p-xl border-b border-surface-container-highest flex flex-col items-center text-center">
<div class="w-12 h-12 bg-primary-fixed rounded-lg flex items-center justify-center mb-md text-primary">
<span class="material-symbols-outlined text-[28px] fill">admin_meds</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">MedScope AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure Clinical Login</p>
</div>
<!-- Form Section -->
<form class="p-xl flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Hospital ID -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="hospital-id">Hospital ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">local_hospital</span>
<input class="clinical-input pl-[44px]" id="hospital-id" placeholder="Enter facility code" type="text">
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="username">Practitioner ID / Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="clinical-input pl-[44px]" id="username" placeholder="Enter practitioner ID" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs mb-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="clinical-input pl-[44px] pr-[44px]" id="password" placeholder="Enter password" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-md rounded-lg transition-colors flex items-center justify-center gap-sm mt-xs" type="submit">
<span class="material-symbols-outlined text-[20px]">login</span>
                Authenticate
            </button>
<!-- Links -->
<div class="flex items-center justify-between mt-sm font-label-sm text-label-sm">
<a class="text-primary hover:text-tertiary-container transition-colors" href="#">Forgot Password?</a>
<a class="text-secondary hover:text-on-surface transition-colors" href="#">Contact IT Support</a>
</div>
</form>
<!-- Footer / Disclaimer -->
<div class="bg-surface-container-low p-md px-xl text-center border-t border-surface-container-highest">
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-start gap-xs text-left">
<span class="material-symbols-outlined text-[16px] text-outline shrink-0 mt-[2px]">info</span>
<span>This system is for authorized clinical personnel only. Access is logged and monitored. Unauthorized access is strictly prohibited and subject to legal action.</span>
</p>
</div>
</div>
</body></html>

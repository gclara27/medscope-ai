[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "ml"]
exclude = [".venv", "**/__pycache__", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in parameter defaults
    "B905",  # zip(strict=) — not required for existing ML plotting code
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["E402"]
"ml/scripts/**/*.py" = ["E402"]
"ml/tests/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "models",
    "repositories",
    "routers",
    "schemas",
    "services",
    "ml",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = false
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/alembic/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
